name: Update Stremio SideStore Source

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stremio-source-update
  cancel-in-progress: false

jobs:
  update-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update source
        env:
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.event.repository.default_branch }}/source.json
        run: python update_source.py

      - name: Commit changes if needed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- source.json

          if git diff --cached --quiet; then
            echo "Source is already up to date."
            exit 0
          fi

          git commit -m "Update Stremio source metadata"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
